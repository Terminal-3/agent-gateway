  changed:
    - timestamp: '2026-11-12T00:00:00Z'
      title: Share identical in-flight Trust Check queries between requests
      description: >-
        Requests that would send the same TRQP query while one is already waiting for its answer
        now await that query instead of sending their own, so concurrent requests from one agent
        cost one registry round trip. A request joins only a query sent less than 2 seconds
        earlier, otherwise it sends its own, which later identical requests then share. A request
        to a registry marked Failed is refused rather than joining a query. Up to 1,024 distinct
        queries are shared at once; past that a new query is sent unshared. Nothing is cached
        once the answer is delivered, failures and timeouts fail every waiting request, and each
        request still writes its own trust_check audit record, marked joined_in_flight when it
        shared a query.
