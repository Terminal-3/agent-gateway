  fixed:
    - timestamp: '2026-11-10T12:00:00Z'
      title: Keep a trust registry usable after a stray problem report
      description: >-
        A problem report that answers no pending query now marks a trust registry Failed only
        when it is on the thread of the gateway's connection-setup message, which the gateway
        records with the registry. Any other such report is logged as a warning with its
        thread ids and leaves the registry's status unchanged, so a connected or reconnected
        registry keeps serving trust checks and Trust Recorder writes. A setup rejection that
        arrives before the gateway saves the new connection now keeps the registry Failed.
